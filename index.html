<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабінет словесності — уроки 6 клас</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700;800&display=swap');

:root{
  --paper:#FAF6EC;
  --paper-2:#F3EDDD;
  --line:#E1D8BE;
  --ink:#2B2E27;
  --ink-soft:#5B5C4F;
  --forest:#3F6152;
  --forest-dark:#2C4A3D;
  --amber:#C97D3D;
  --amber-dark:#A6612A;
  --sky:#4E7A99;
  --correct:#4C7A4B;
  --correct-bg:#E7F0E3;
  --incorrect:#B15347;
  --incorrect-bg:#F6E7E3;
  --radius-card: 4px 18px 4px 18px;
}
.lesson-content.theme-plum{
  --forest:#4A5A8C;
  --forest-dark:#313F66;
  --amber:#C9548B;
  --amber-dark:#9C3E6C;
  --sky:#3F8F86;
}
.lesson-content.theme-terracotta{
  --forest:#8C4A34;
  --forest-dark:#6B3626;
  --amber:#3F7D6B;
  --amber-dark:#2E5D4F;
  --sky:#C9922A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Karla',sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Lora',serif;
  color:var(--forest-dark);
  margin:0 0 .4em 0;
  font-weight:600;
}
p{margin:0 0 1em 0;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--amber);color:#fff;}
a{color:var(--sky);}

/* ---------- layout shells ---------- */
.app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  background:var(--forest);
  color:#F3EDDD;
  padding:18px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border-bottom:5px solid var(--forest-dark);
}
.topbar .brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:38px;height:38px;flex:none;
  border-radius:50%;
  background:var(--amber);
  display:flex;align-items:center;justify-content:center;
  font-family:'Lora',serif;font-weight:700;color:#fff;font-size:18px;
}
.brand-text h1{color:#fff;font-size:20px;margin:0;letter-spacing:.2px;}
.brand-text span{font-size:13px;color:#D8E4D9;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.pill-btn{
  border:1.5px solid rgba(255,255,255,.55);
  background:transparent;color:#fff;
  padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;
  transition:background .15s ease, border-color .15s ease;
}
.pill-btn:hover{background:rgba(255,255,255,.14);}
.pill-btn.solid{background:var(--amber);border-color:var(--amber);}
.pill-btn.solid:hover{background:var(--amber-dark);border-color:var(--amber-dark);}

main{flex:1;width:100%;}

/* ---------- HOME VIEW ---------- */
#home-view{max-width:1080px;margin:0 auto;padding:0 28px 90px;}
.text-nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 0 18px;border-bottom:1.5px solid var(--line);margin-bottom:40px;
}
.text-nav span{
  font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--ink-soft);
}
.text-nav button{
  background:none;border:none;font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--ink-soft);
  padding:0;
}
.text-nav button:hover{color:var(--forest-dark);}

.home-hero{margin-bottom:44px;}
.home-hero h2{
  font-family:'Karla',sans-serif;font-weight:800;font-size:44px;letter-spacing:-.5px;
  color:var(--ink);margin-bottom:14px;
}
.home-hero h2 .accent{color:var(--amber);}
.home-hero p{color:var(--ink-soft);max-width:560px;font-size:15.5px;}

.category-block{margin-bottom:40px;}
.category-title{
  font-family:'Karla',sans-serif;font-weight:800;font-size:19px;color:var(--ink);
  padding-bottom:12px;border-bottom:1.5px solid var(--line);margin-bottom:20px;
}

.lesson-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:18px;
}
.lesson-card{
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:16px;
  padding:20px 20px 18px;
  display:flex;flex-direction:column;
  min-height:170px;
  position:relative;
  transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.lesson-card:hover{border-color:var(--forest);transform:translateY(-2px);}
.lesson-card.is-draft{background:var(--paper-2);}
.card-top-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.avatar-box{
  width:40px;height:40px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:'Karla',sans-serif;font-weight:800;font-size:15px;
}
.status-slot{position:relative;height:24px;}
.status-chip{
  font-size:11px;font-weight:800;letter-spacing:.4px;padding:4px 10px;border-radius:999px;
  background:var(--correct-bg);color:var(--correct);white-space:nowrap;
  transition:opacity .15s ease;
}
.lesson-card.is-draft .status-chip{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);}
.lesson-card .del-btn{
  position:absolute;top:0;right:0;
  width:24px;height:24px;border:none;background:var(--incorrect-bg);color:var(--incorrect);
  border-radius:50%;font-size:13px;line-height:1;opacity:0;
  display:flex;align-items:center;justify-content:center;transition:opacity .15s ease;
}
.lesson-card:hover .status-chip{opacity:0;}
.lesson-card:hover .del-btn{opacity:1;}
.lesson-card h3{
  font-family:'Karla',sans-serif;font-weight:700;font-size:16.5px;margin-bottom:6px;color:var(--ink);
}
.lesson-card.is-draft h3{color:var(--ink-soft);}
.lesson-card p.desc{color:var(--ink-soft);font-size:13.5px;flex:1;margin:0;line-height:1.45;}

.add-row{
  border:1.5px dashed var(--line);background:transparent;width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  color:var(--ink-soft);font-weight:700;font-size:14px;padding:16px;border-radius:14px;margin-top:8px;
}
.add-row:hover{border-color:var(--forest);color:var(--forest-dark);background:var(--paper-2);}
.add-plus{font-size:20px;color:var(--forest);line-height:1;}

/* ---------- MODAL ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(43,46,39,.45);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--paper);border-radius:6px 20px 6px 20px;padding:28px;max-width:440px;width:100%;
  border:1.5px solid var(--line);
}
.modal h3{margin-bottom:4px;}
.modal p.hint{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--forest-dark);margin-bottom:5px;}
.field input, .field textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;
  font-family:inherit;font-size:14.5px;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
.btn{
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;border:1.5px solid transparent;
}
.btn.primary{background:var(--forest);color:#fff;}
.btn.primary:hover{background:var(--forest-dark);}
.btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
.btn.ghost:hover{border-color:var(--ink-soft);}

/* ---------- LESSON VIEW ---------- */
#lesson-view{display:none;}
.lesson-shell{max-width:860px;margin:0 auto;padding:28px 28px 90px;}
.back-row{max-width:860px;margin:20px auto 0;padding:0 28px;}
.back-link{background:none;border:none;color:var(--forest-dark);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;}
.back-link:hover{text-decoration:underline;}

.dot-nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px;}
.dot-item{
  display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;
  padding:7px 13px 7px 9px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft);
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.dot-item .dot-num{
  width:20px;height:20px;border-radius:50%;background:var(--paper-2);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;
}
.dot-item.active{background:var(--forest);border-color:var(--forest);color:#fff;}
.dot-item.active .dot-num{background:var(--amber);border-color:var(--amber);color:#fff;}
.dot-item.done .dot-num{background:var(--forest);border-color:var(--forest);color:#fff;}
.dot-item:hover{border-color:var(--forest);}

.lesson-content{width:100%;}
.lesson-header{margin-bottom:6px;}
.lesson-header .eyebrow{font-size:13px;color:var(--sky);font-weight:700;margin-bottom:6px;}
.lesson-header h2{font-size:27px;}
.progress-track{height:6px;background:var(--line);border-radius:99px;margin-top:14px;overflow:hidden;}
.progress-fill{height:100%;background:var(--amber);border-radius:99px;transition:width .3s ease;}

/* games: quickfire true/false */
.quickfire-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.qf-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;background:#fff;
}
.qf-text{font-size:14.5px;font-weight:600;flex:1;}
.qf-btns{display:flex;gap:8px;flex:none;}
.qf-btn{
  border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px;
}
.qf-btn.pick-yes:hover{border-color:var(--correct);}
.qf-btn.pick-no:hover{border-color:var(--incorrect);}
.qf-row.answered{opacity:.9;}
.qf-row.right{border-color:var(--correct);background:var(--correct-bg);}
.qf-row.wrong{border-color:var(--incorrect);background:var(--incorrect-bg);}
.qf-badge{font-size:16px;flex:none;width:22px;text-align:center;}

/* games: punctuation picker */
.punct-row{
  display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 16px;background:#fff;margin-top:10px;
}
.punct-sentence{font-family:'Lora',serif;font-size:16px;font-style:italic;flex:1;}
.punct-opts{display:flex;gap:6px;flex:none;}
.punct-opt{
  width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper-2);
  font-weight:800;font-size:16px;
}
.punct-opt.chosen-right{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);}
.punct-opt.chosen-wrong{background:var(--incorrect-bg);border-color:var(--incorrect);color:var(--incorrect);}

/* mood picker */
.mood-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.mood-btn{
  font-size:26px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;
  transition:transform .15s ease, border-color .15s ease;
}
.mood-btn:hover{transform:translateY(-3px);}
.mood-btn.picked{border-color:var(--amber);background:#FBF1E5;}

/* games: flip cards */
.flip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px;}
.flip-card{perspective:900px;height:110px;cursor:pointer;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
  font-weight:700;font-size:14.5px;border:1.5px solid var(--line);
}
.flip-front{background:var(--forest);color:#fff;}
.flip-back{background:var(--paper-2);color:var(--forest-dark);transform:rotateY(180deg);font-size:13px;font-weight:600;}

/* games: match pairs */
.match-game-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:14px;}
.match-pile{display:flex;flex-direction:column;gap:9px;}
.match-card{
  border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .15s ease;
}
.match-card.selected{border-color:var(--sky);background:var(--paper-2);}
.match-card.locked{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);cursor:default;}
.match-card.shake{animation:shake .35s;border-color:var(--incorrect);background:var(--incorrect-bg);}
@keyframes shake{
  0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);}
}
.game-score{font-size:13px;font-weight:700;color:var(--forest-dark);margin-top:10px;}

/* games: baskets */
.basket-row{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;}
.basket{
  flex:1;min-width:220px;border:2px dashed var(--line);border-radius:14px;padding:14px;min-height:110px;
  background:var(--paper-2);
}
.basket h5{margin:0 0 8px;font-size:13px;font-weight:800;color:var(--forest-dark);}
.basket-item{
  display:inline-block;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;
  font-size:13.5px;font-weight:600;margin:4px 4px 0 0;cursor:pointer;
}
.pool-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.basket-item.placed-correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);cursor:default;}
.basket-item.placed-wrong{border-color:var(--incorrect);background:var(--incorrect-bg);color:var(--incorrect);cursor:default;}

.confetti-wrap{position:relative;overflow:visible;}
.confetti-emoji{position:absolute;top:-6px;font-size:20px;animation:fall 1.4s ease-in forwards;}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(90px) rotate(200deg);opacity:0;}
}

.panel{
  background:#fff;border:1.5px solid var(--line);border-radius:4px 22px 4px 22px;
  padding:28px 30px;margin-bottom:20px;
  background-image:repeating-linear-gradient(to bottom, transparent 0 39px, var(--paper-2) 39px 40px);
  background-position: 0 6px;
}
.panel.plain{background-image:none;}
.panel h3{font-size:20px;margin-bottom:12px;}
.panel h4{font-size:15.5px;color:var(--amber-dark);margin:18px 0 8px;}
.subtle{color:var(--ink-soft);font-size:14.5px;}

.callout{
  border-left:4px solid var(--forest);background:var(--paper-2);padding:14px 18px;border-radius:0 10px 10px 0;margin:14px 0;
}
.callout.amber{border-left-color:var(--amber);}
.example{
  font-style:italic;color:var(--forest-dark);
}
.def-box{
  border:1.5px dashed var(--forest);border-radius:10px;padding:16px 18px;margin:14px 0;background:var(--paper-2);
}
.def-box .term{font-family:'Lora',serif;font-weight:700;color:var(--forest-dark);font-size:16px;}

.reading-text{
  font-family:'Lora',serif;font-size:16.5px;line-height:1.75;color:var(--ink);
}
.reading-text p{margin-bottom:1em;}

.task-block{margin-top:22px;padding-top:18px;border-top:1.5px dashed var(--line);}
.task-block .task-label{font-size:12.5px;font-weight:800;color:var(--sky);letter-spacing:.3px;margin-bottom:6px;}
.task-block .task-q{font-weight:700;margin-bottom:10px;}

.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt{
  display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;
  cursor:pointer;font-size:14.5px;background:#fff;
}
.opt:hover{border-color:var(--forest);}
.opt input{accent-color:var(--forest);width:16px;height:16px;flex:none;}
.opt.correct{border-color:var(--correct);background:var(--correct-bg);}
.opt.incorrect{border-color:var(--incorrect);background:var(--incorrect-bg);}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.chip{
  border:1.5px solid var(--line);background:#fff;padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;
}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff;}

textarea.answer-box, input.answer-box{
  width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:14.5px;background:#fff;
}
input.blank{
  display:inline-block;width:120px;border:none;border-bottom:2px solid var(--amber);background:transparent;
  font-family:'Lora',serif;font-style:italic;font-size:16px;padding:2px 4px;color:var(--forest-dark);
}

.check-btn{
  margin-top:14px;background:var(--sky);color:#fff;border:none;padding:9px 18px;border-radius:999px;font-weight:700;font-size:13.5px;
}
.check-btn:hover{background:#3D6480;}
.feedback{margin-top:10px;font-size:14px;font-weight:700;}
.feedback.ok{color:var(--correct);}
.feedback.bad{color:var(--incorrect);}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:10px;}
.match-col-h{font-size:12.5px;font-weight:800;color:var(--ink-soft);}
.match-item{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;background:#fff;}

.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
.nav-btn{background:var(--forest);color:#fff;border:none;padding:11px 22px;border-radius:999px;font-weight:700;font-size:14px;}
.nav-btn:hover{background:var(--forest-dark);}
.nav-btn.secondary{background:transparent;color:var(--forest-dark);border:1.5px solid var(--forest);}
.nav-btn.secondary:hover{background:#EDF3EC;}
.nav-btn[disabled]{opacity:.4;cursor:not-allowed;}

/* quiz */
.quiz-q{margin-bottom:24px;padding-bottom:20px;border-bottom:1px dashed var(--line);}
.quiz-q:last-child{border-bottom:none;}
.quiz-q .q-num{font-family:'Lora',serif;font-weight:700;color:var(--amber-dark);}
.score-banner{
  border-radius:12px;padding:18px 22px;margin-bottom:18px;display:flex;align-items:center;gap:16px;
}
.score-banner.great{background:var(--correct-bg);}
.score-banner.ok{background:#F5EFDB;}
.score-banner.retry{background:var(--incorrect-bg);}
.score-num{font-family:'Lora',serif;font-size:34px;font-weight:700;color:var(--forest-dark);}

.reflect-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;}
@media (max-width:640px){.reflect-grid{grid-template-columns:1fr;}}

.doodle{width:64px;height:64px;flex:none;}
.panel-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.panel-head h3{margin:0;}
.panel-icon{flex:none;width:34px;height:34px;color:var(--amber);}
.panel-icon svg{width:100%;height:100%;}
.step-icon{width:16px;height:16px;flex:none;color:inherit;}

.draft-note{
  background:var(--paper-2);border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink-soft);
}

@media (max-width:820px){
  .match-game-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">

  <main>
    <!-- ============ HOME ============ -->
    <div id="home-view">
      <div class="text-nav">
        <span>НАВІГАЦІЯ</span>
        <button onclick="openAddModal()">+ ДОДАТИ УРОК</button>
      </div>
      <div class="home-hero">
        <h2>УСІ <span class="accent">УРОКИ</span></h2>
        <p>Ця сторінка — лише для вас. Відкрийте потрібну тему, щоб пояснювати матеріал і малювати прямо на екрані.</p>
      </div>
      <div id="category-list"></div>
      <button class="add-row" onclick="openAddModal()"><span class="add-plus">+</span> Додати урок</button>
    </div>

    <!-- ============ LESSON (draft placeholder) ============ -->
    <div class="back-row" id="back-row" style="display:none;">
      <button class="back-link" onclick="showHome()">← Усі уроки</button>
    </div>
    <div id="lesson-view">
      <div class="lesson-shell" id="lesson-shell"></div>
    </div>
  </main>
</div>

<!-- Add lesson modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h3>Новий урок</h3>
    <p class="hint">Додайте картку-заготовку. Наповнити її вправами та завданнями зможете згодом.</p>
    <div class="field">
      <label>Назва теми</label>
      <input type="text" id="f-title" placeholder="Напр., Іменник як частина мови">
    </div>
    <div class="field">
      <label>Розділ / § підручника</label>
      <input type="text" id="f-topic" placeholder="Напр., Морфологія · §7">
    </div>
    <div class="field">
      <label>Тривалість</label>
      <input type="text" id="f-duration" placeholder="45 хв" value="45 хв">
    </div>

<script>
/* ============================================================
   STORAGE
============================================================ */
const SEED_ID = "slovospoluchennya-rechennya-6";

const SEED_META = {
  id: SEED_ID,
  title: "Словосполучення і речення. Головні й другорядні члени речення",
  topic: "Синтаксис · §4–5",
  duration: "45 хв",
  status: "ready",
  createdAt: Date.now()
};

const SEED2_ID = "zvertannya-vstavni-odnoridni-6";
const SEED2_META = {
  id: SEED2_ID,
  title: "Звертання. Вставні слова. Однорідні члени речення",
  topic: "Синтаксис · §6",
  duration: "45 хв",
  status: "ready",
  createdAt: Date.now() - 1000
};

const SEED3_ID = "skladne-rechennya-pryama-mova-6";
const SEED3_META = {
  id: SEED3_ID,
  title: "Складне речення. Пряма мова. Діалог",
  topic: "Синтаксис · §7",
  duration: "45 хв",
  status: "ready",
  createdAt: Date.now() - 2000
};

async function loadMeta(){
  try{
    const res = await window.storage.get('lessons-meta', false);
    if(res && res.value) return JSON.parse(res.value);
    return null;
  }catch(e){ return null; }
}
async function saveMeta(list){
  try{ await window.storage.set('lessons-meta', JSON.stringify(list), false); }
  catch(e){ console.error('storage set failed', e); }
}

let lessonsMeta = [];

async function initStorage(){
  let meta = await loadMeta();
  if(!meta || !Array.isArray(meta) || meta.length === 0){
    meta = [SEED3_META, SEED2_META, SEED_META];
    await saveMeta(meta);
  } else {
    let changed = false;
    if(!meta.find(m => m.id === SEED_ID)){ meta.push(SEED_META); changed = true; }
    if(!meta.find(m => m.id === SEED2_ID)){ meta.push(SEED2_META); changed = true; }
    if(!meta.find(m => m.id === SEED3_ID)){ meta.push(SEED3_META); changed = true; }
    if(changed) await saveMeta(meta);
  }
  lessonsMeta = meta;
  renderGrid();
}

/* ============================================================
   HOME / GRID
============================================================ */
const AVATAR_TINTS = [
  {bg:'#E7F0E3', fg:'#3F6152'},
  {bg:'#F5E8DA', fg:'#A6612A'},
  {bg:'#E1EAF0', fg:'#4E7A99'},
];
function categoryOf(m){
  if(!m.topic) return 'Інше';
  return m.topic.split('·')[0].trim() || 'Інше';
}
function renderGrid(){
  const wrap = document.getElementById('category-list');
  wrap.innerHTML = '';

  const categories = [];
  const byCat = new Map();
  lessonsMeta.forEach(m => {
    const cat = categoryOf(m);
    if(!byCat.has(cat)){ byCat.set(cat, []); categories.push(cat); }
    byCat.get(cat).push(m);
  });

  categories.forEach(cat => {
    const block = document.createElement('div');
    block.className = 'category-block';
    const grid = document.createElement('div');
    grid.className = 'lesson-grid';
    byCat.get(cat).forEach((m, i) => {
      const isDraft = m.status === 'draft';
      const tint = isDraft ? {bg:'#EFE9D9', fg:'#8A8371'} : AVATAR_TINTS[i % AVATAR_TINTS.length];
      const card = document.createElement('div');
      card.className = 'lesson-card' + (isDraft ? ' is-draft' : '');
      card.innerHTML = `
        <div class="card-top-row">
          <div class="avatar-box" style="background:${tint.bg};color:${tint.fg};">${(m.title || '?').trim()[0].toUpperCase()}</div>
          <div class="status-slot">
            <span class="status-chip">${isDraft ? 'СКОРО' : 'ГОТОВО'}</span>
            <button class="del-btn" title="Видалити" onclick="event.stopPropagation(); deleteLesson('${m.id}')">✕</button>
          </div>
        </div>
        <h3>${m.title}</h3>
        <p class="desc">${isDraft ? (m.note || 'Вміст ще не додано.') : 'Інтерактивний конспект: теорія, читання, вправи й тест.'}</p>
      `;
      card.addEventListener('click', () => openLesson(m.id));
      grid.appendChild(card);
    });
    const heading = document.createElement('div');
    heading.className = 'category-title';
    heading.textContent = cat;
    block.appendChild(heading);
    block.appendChild(grid);
    wrap.appendChild(block);
  });
}

async function deleteLesson(id){
  if(id === SEED_ID || id === SEED2_ID || id === SEED3_ID){
    if(!confirm('Це готовий приклад уроку. Точно видалити?')) return;
  }
  lessonsMeta = lessonsMeta.filter(m => m.id !== id);
  await saveMeta(lessonsMeta);
  renderGrid();
}

function openAddModal(){ document.getElementById('modal-backdrop').classList.add('open'); }
function closeAddModal(){
  document.getElementById('modal-backdrop').classList.remove('open');
  ['f-title','f-topic','f-note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-duration').value = '45 хв';
}
async function saveNewLesson(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ alert('Вкажіть назву теми'); return; }
  const meta = {
    id: 'lesson-' + Date.now(),
    title,
    topic: document.getElementById('f-topic').value.trim() || 'Новий розділ',
    duration: document.getElementById('f-duration').value.trim() || '45 хв',
    note: document.getElementById('f-note').value.trim(),
    status: 'draft',
    createdAt: Date.now()
  };
  lessonsMeta.unshift(meta);
  await saveMeta(lessonsMeta);
  closeAddModal();
  renderGrid();
}

function showHome(){
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('lesson-view').style.display = 'none';
  document.getElementById('back-row').style.display = 'none';
}

/* ============================================================
   OPEN LESSON
============================================================ */
function openLesson(id){
  document.getElementById('home-view').style.display = 'none';
  document.getElementById('lesson-view').style.display = 'block';
  document.getElementById('back-row').style.display = 'block';

  if(LESSON_REGISTRY[id]){
    ACTIVE_LESSON_ID = id;
    renderFullLesson();
  } else {
    const m = lessonsMeta.find(x => x.id === id);
    document.getElementById('lesson-shell').innerHTML = `
      <div class="lesson-content" style="width:100%">
        <div class="lesson-header">
          <div class="eyebrow">${m.topic}</div>
          <h2>${m.title}</h2>
        </div>
        <div class="draft-note">
          <p style="margin-bottom:6px;font-weight:700;color:var(--ink);">Ця картка поки чернетка</p>
          <p style="margin:0;">${m.note ? m.note : 'Опишіть тут теорію, текст для читання, вправи й тест — так само, як зроблено в готових уроках.'}</p>
        </div>
      </div>
    `;
  }
}

/* ============================================================
   FULL LESSON: STEP DATA
============================================================ */
const STEPS = [
  {key:'warmup', title:'Розігрів', time:'5 хв', icon:'clock'},
  {key:'theory', title:'Теорія', time:'10 хв', icon:'book'},
  {key:'reading', title:'Читання', time:'10 хв', icon:'bubble'},
  {key:'practice', title:'Практика', time:'10 хв', icon:'pencil'},
  {key:'quiz', title:'Тест', time:'8 хв', icon:'check'},
  {key:'reflect', title:'Підсумок', time:'2 хв', icon:'bulb'},
];

const ICONS = {
  clock: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>',
  book: '<path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5C4.7 20 4 19.3 4 18.5v-13Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5v-13Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  bubble: '<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H10l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5v-7Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  pencil: '<path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 7 17 10.5" stroke="currentColor" stroke-width="2"/>',
  check: '<rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12.5l2.5 2.5L16 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',

};
function iconSvg(name, cls){
  return `<span class="${cls || 'panel-icon'}"><svg viewBox="0 0 24 24">${ICONS[name] || ''}</svg></span>`;
}

let currentStep = 0;
let quizAnswers = {};
let quizChecked = false;
let ACTIVE_LESSON_ID = null;

function renderFullLesson(){
  const shell = document.getElementById('lesson-shell');
  const meta = lessonsMeta.find(m => m.id === ACTIVE_LESSON_ID) || {};
  const reg = LESSON_REGISTRY[ACTIVE_LESSON_ID];
  currentStep = 0;
  shell.innerHTML = `
    <div class="lesson-content ${reg.themeClass || ''}">
      <div class="lesson-header">
        <div class="eyebrow">${meta.topic || ''}</div>
        <h2>${meta.title || ''}</h2>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="dot-nav" id="dot-nav"></div>
      </div>
      <div id="step-panel"></div>
    </div>
  `;
  renderDotNav();
  renderStepPanel();
}

function renderDotNav(){
  const nav = document.getElementById('dot-nav');
  nav.innerHTML = '';
  STEPS.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'dot-item' + (i === currentStep ? ' active' : '') + (i < currentStep ? ' done' : '');
    el.innerHTML = `<span class="dot-num">${i < currentStep ? '✓' : i+1}</span> ${s.title}`;
    el.onclick = () => { currentStep = i; renderDotNav(); renderStepPanel(); };
    nav.appendChild(el);
  });
}

function goStep(delta){
  currentStep = Math.max(0, Math.min(STEPS.length - 1, currentStep + delta));
  renderDotNav();
  renderStepPanel();
  document.getElementById('lesson-view').scrollIntoView({behavior:'smooth', block:'start'});
}

function renderStepPanel(){
  const panel = document.getElementById('step-panel');
  document.getElementById('progress-fill').style.width = ((currentStep) / (STEPS.length-1) * 100) + '%';
  const key = STEPS[currentStep].key;
  const reg = LESSON_REGISTRY[ACTIVE_LESSON_ID];
  let html = (reg.html[key] || (() => ''))();

  html += `
    <div class="nav-row">
      <button class="nav-btn secondary" onclick="goStep(-1)" ${currentStep === 0 ? 'disabled' : ''}>← Назад</button>
      <button class="nav-btn" onclick="goStep(1)" ${currentStep === STEPS.length-1 ? 'disabled' : ''}>Далі →</button>
    </div>
  `;
  panel.innerHTML = html;
  if(reg.attach[key]) reg.attach[key]();
}

/* ---------- 1. WARM-UP ---------- */
const QF_ITEMS = [
  {t:'«Тепла оселя» — це словосполучення.', answer:true},

      </div>

/* ---------- 2. THEORY ---------- */
/* ---------- 2. THEORY ---------- */
function attachWarmupHandlers(){
  qfScore = 0;
  const list = document.getElementById('qf-list');
  list.innerHTML = QF_ITEMS.map((it,i) => `
    <div class="qf-row" data-i="${i}">
      <span class="qf-text">${it.t}</span>
      <span class="qf-badge"></span>
      <div class="qf-btns">
        <button class="qf-btn pick-yes">Так</button>
        <button class="qf-btn pick-no">Ні</button>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.qf-row').forEach((row, i) => {
    row.querySelectorAll('.qf-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if(row.classList.contains('answered')) return;
        const picked = btn.classList.contains('pick-yes');
        const isRight = picked === QF_ITEMS[i].answer;
        row.classList.add('answered', isRight ? 'right' : 'wrong');
        row.querySelector('.qf-badge').textContent = isRight ? '✓' : '✕';
        row.querySelectorAll('.qf-btn').forEach(b => b.disabled = true);
        if(isRight) qfScore++;
        document.getElementById('qf-score').textContent = `Рахунок: ${qfScore}/${QF_ITEMS.length}`;
      });
    });
  });
}
function theoryHTML(){

const PUNCT_ITEMS = [
  {s:'Дощ ущух', opts:['.','?','!'], correct:0},
  {s:'Ти вже зробив уроки', opts:['.','?','!'], correct:1},
  {s:'Тікай, вода прибуває', opts:['.','?','!'], correct:2},
];
function attachPunctGame(){
  const wrap = document.getElementById('punct-list');
  if(!wrap) return;
  wrap.innerHTML = PUNCT_ITEMS.map((it,i) => `
    <div class="punct-row" data-i="${i}">
      <span class="punct-sentence">${it.s}<span class="chosen-mark"></span></span>
      <div class="punct-opts">
        ${it.opts.map((o,oi)=>`<button class="punct-opt" data-oi="${oi}">${o}</button>`).join('')}
      </div>
    </div>
  `).join('');
  wrap.querySelectorAll('.punct-row').forEach((row,i) => {
    row.querySelectorAll('.punct-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        if(row.dataset.done) return;
        const oi = parseInt(btn.dataset.oi);
        const isRight = oi === PUNCT_ITEMS[i].correct;
        btn.classList.add(isRight ? 'chosen-right' : 'chosen-wrong');
        if(isRight){
          row.dataset.done = '1';
          row.querySelector('.chosen-mark').textContent = ' ' + PUNCT_ITEMS[i].opts[oi];
        }
      });
    });
  });
}

function renderP1Pool(){

const MATCH_PAIRS = [
  {left:'Підмет', right:'хто? що?'},
  {left:'Присудок', right:'що робить?'},
  {left:'Означення', right:'який? чий?'},
  {left:'Додаток', right:'кого? що?'},
  {left:'Обставина', right:'де? коли?'},
];
let matchLeftPicked = null;
let matchFound = 0;
function initMatchGame(){
  matchLeftPicked = null;
  matchFound = 0;
  const leftWrap = document.getElementById('match-left');
  const rightWrap = document.getElementById('match-right');
  if(!leftWrap || !rightWrap) return;
  leftWrap.innerHTML = MATCH_PAIRS.map((p,i) => `<div class="match-card" data-idx="${i}" data-side="left">${p.left}</div>`).join('');
  const shuffled = MATCH_PAIRS.map((p,i) => ({...p, i})).sort(() => Math.random() - 0.5);
  rightWrap.innerHTML = shuffled.map(p => `<div class="match-card" data-idx="${p.i}" data-side="right">${p.right}</div>`).join('');
  document.querySelectorAll('#match-left .match-card, #match-right .match-card').forEach(card => {
    card.addEventListener('click', () => onMatchClick(card));
  });
}
function onMatchClick(card){
  if(card.classList.contains('locked')) return;
  if(card.dataset.side === 'left'){
    document.querySelectorAll('#match-left .match-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    matchLeftPicked = card;
  } else {
    if(!matchLeftPicked) return;
    const isMatch = matchLeftPicked.dataset.idx === card.dataset.idx;
    if(isMatch){
      matchLeftPicked.classList.add('locked');
      matchLeftPicked.classList.remove('selected');
      card.classList.add('locked');
      matchFound++;
      matchLeftPicked = null;
      const el = document.getElementById('match-score');
      if(el) el.textContent = `Знайдено пар: ${matchFound}/${MATCH_PAIRS.length}`;
    } else {
      card.classList.add('shake');
      matchLeftPicked.classList.add('shake');
      const badLeft = matchLeftPicked;
      setTimeout(() => {
        card.classList.remove('shake');
        badLeft.classList.remove('shake','selected');
      }, 380);
      matchLeftPicked = null;
    }
  }
}

const BUILDER_WORDS = ['Веселий','песик','швидко','біг','стежкою'];
let builderBuilt = [];
let builderPool = [];
function renderBuilder(){
  const target = document.getElementById('builder-target');
  const pool = document.getElementById('builder-pool');
  if(!target || !pool) return;
  target.innerHTML = builderBuilt.length
    ? builderBuilt.map((w,i)=>`<span class="basket-item" data-i="${i}" style="cursor:pointer;">${w}</span>`).join(' ')
    : '<span class="subtle">Тут з\u2019явиться ваше речення…</span>';
  pool.innerHTML = builderPool.map((w,i)=>`<span class="basket-item" data-i="${i}">${w}</span>`).join('');
  target.querySelectorAll('.basket-item').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.i);
      builderPool.push(builderBuilt[i]);
      builderBuilt.splice(i,1);
      renderBuilder();
    });
  });
  pool.querySelectorAll('.basket-item').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.i);
      builderBuilt.push(builderPool[i]);
      builderPool.splice(i,1);
      renderBuilder();
    });
  });
  const fb = document.getElementById('builder-feedback');
  if(fb){ fb.textContent = ''; fb.className = 'feedback'; }
}
function attachBuilderGame(){
  builderBuilt = [];
  builderPool = shuffleArray(BUILDER_WORDS);
  renderBuilder();
}
function checkBuilder(){
  const fb = document.getElementById('builder-feedback');
  const isRight = JSON.stringify(builderBuilt) === JSON.stringify(BUILDER_WORDS);
  fb.className = 'feedback ' + (isRight ? 'ok' : 'bad');
  fb.textContent = isRight
    ? 'Чудово! Речення складене правильно: «Веселий песик швидко біг стежкою.»'
    : builderBuilt.length < BUILDER_WORDS.length ? 'Спершу розкладіть усі слова.' : 'Ще не той порядок — спробуйте ще раз.';
}

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
let QUIZ_ACTIVE = [];
function quizHTML(bank){
  const source = bank || QUIZ;
  QUIZ_ACTIVE = source.map(item => {
    const order = shuffleArray(item.opts.map((_, i) => i));
    return {
      q: item.q,
      opts: order.map(i => item.opts[i]),
      correct: order.indexOf(item.correct)
    };
  });
  let html = `<div class="panel plain" id="quiz-result-slot"></div><div class="panel"><div class="panel-head">${iconSvg('check')}<h3 style="margin-bottom:0;">Перевіримо себе</h3></div>`;
  QUIZ_ACTIVE.forEach((item, qi) => {
    html += `
      <div class="quiz-q">
        <div class="task-q"><span class="q-num">${qi+1}.</span> ${item.q}</div>
        <div class="opt-list" data-qi="${qi}">
          ${item.opts.map((o,oi)=>`
            <label class="opt" data-oi="${oi}">
              <input type="radio" name="quiz-${qi}" value="${oi}">
              <span>${o}</span>
            </label>`).join('')}
        </div>
      </div>
    `;
  });
  html += `<button class="check-btn" style="margin-top:4px;" onclick="submitQuiz()">Перевірити тест</button></div>`;

function attachQuizHandlers(){
  quizChecked = false;
  quizAnswers = {};
  document.querySelectorAll('#step-panel .opt-list[data-qi]').forEach(list => {
    const qi = list.dataset.qi;
    list.querySelectorAll('.opt').forEach(opt => {
      opt.addEventListener('click', () => {
        if(quizChecked) return;
        quizAnswers[qi] = parseInt(opt.dataset.oi);
        list.querySelectorAll('.opt').forEach(o=>o.querySelector('input').checked=false);
        opt.querySelector('input').checked = true;
      });
    });
  });
}
function submitQuiz(){
  let score = 0;
  QUIZ_ACTIVE.forEach((item, qi) => {
    const list = document.querySelector(`#step-panel .opt-list[data-qi="${qi}"]`);
    const chosen = quizAnswers[qi];
    list.querySelectorAll('.opt').forEach((opt, oi) => {
      if(oi === item.correct) opt.classList.add('correct');
      else if(oi === chosen) opt.classList.add('incorrect');
    });
    if(chosen === item.correct) score++;
  });
  quizChecked = true;
  const pct = Math.round(score / QUIZ_ACTIVE.length * 100);
  let tier = 'retry', msg = 'Варто повернутися до теорії й спробувати ще раз.', emoji = '💪';
  if(pct >= 85){ tier='great'; msg = 'Чудовий результат — тему засвоєно міцно!'; emoji = '🏆'; }
  else if(pct >= 60){ tier='ok'; msg = 'Непогано! Погляньте ще раз на питання, де були помилки.'; emoji = '👍'; }
  document.getElementById('quiz-result-slot').innerHTML = `
    <div class="score-banner ${tier} confetti-wrap" id="score-banner">
      <div class="score-num">${score}/${QUIZ_ACTIVE.length}</div>
      <div>
        <div style="font-weight:700;">${emoji} ${msg}</div>
        <div class="subtle">Правильні відповіді підсвічено зеленим, помилкові — червоним.</div>
      </div>
    </div>
  `;
  if(tier === 'great'){
    const banner = document.getElementById('score-banner');
    const bits = ['🎉','✨','⭐','🎊','💚'];
    for(let i=0;i<14;i++){
      const span = document.createElement('span');
      span.className = 'confetti-emoji';
      span.textContent = bits[i % bits.length];
      span.style.left = (Math.random()*90 + 2) + '%';
      span.style.animationDelay = (Math.random()*0.4) + 's';
      banner.appendChild(span);
    }
  }
}

function genMatchGame(leftId, rightId, scoreId, pairs){
  let leftPicked = null, found = 0;
  const leftWrap = document.getElementById(leftId), rightWrap = document.getElementById(rightId);
  if(!leftWrap || !rightWrap) return;
  leftWrap.innerHTML = pairs.map((p,i) => `<div class="match-card" data-idx="${i}" data-side="left">${p.left}</div>`).join('');
  const shuffled = pairs.map((p,i) => ({...p, i})).sort(() => Math.random() - 0.5);
  rightWrap.innerHTML = shuffled.map(p => `<div class="match-card" data-idx="${p.i}" data-side="right">${p.right}</div>`).join('');
  function onClick(card){
    if(card.classList.contains('locked')) return;
    if(card.dataset.side === 'left'){
      leftWrap.querySelectorAll('.match-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      leftPicked = card;
    } else {
      if(!leftPicked) return;
      const isMatch = leftPicked.dataset.idx === card.dataset.idx;
      if(isMatch){
        leftPicked.classList.add('locked');
        leftPicked.classList.remove('selected');
        card.classList.add('locked');
        found++;
        leftPicked = null;
        const el = document.getElementById(scoreId);
        if(el) el.textContent = `Знайдено пар: ${found}/${pairs.length}`;
      } else {
        card.classList.add('shake');
        leftPicked.classList.add('shake');
        const bad = leftPicked;
        setTimeout(() => { card.classList.remove('shake'); bad.classList.remove('shake','selected'); }, 380);
        leftPicked = null;
      }
    }
  }
  document.querySelectorAll(`#${leftId} .match-card, #${rightId} .match-card`).forEach(card => {
    card.addEventListener('click', () => onClick(card));
  });
}
function genBasketGame(poolId, baskets, items, scoreId){
  let selected = null, score = 0;
  const state = items.map((it,i) => ({...it, i, placed:false}));
  function renderPool(){
    const pool = document.getElementById(poolId);
    pool.innerHTML = state.filter(it => !it.placed).map(it => `<span class="basket-item" data-i="${it.i}">${it.t}</span>`).join('');
    pool.querySelectorAll('.basket-item').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        pool.querySelectorAll('.basket-item').forEach(x => x.style.outline = '');
        el.style.outline = '2px solid var(--sky)';
        selected = parseInt(el.dataset.i);
      });
    });
  }
  baskets.forEach(b => { document.getElementById(b.elId).innerHTML = ''; });
  renderPool();
  document.querySelectorAll(`[data-basket-for="${poolId}"]`).forEach(basketEl => {
    basketEl.addEventListener('click', () => {
      if(selected === null) return;
      const item = state.find(it => it.i === selected);
      if(!item || item.placed) return;
      item.placed = true;
      const type = basketEl.dataset.type;
      const isRight = type === item.correctType;
      const wrapId = baskets.find(b => b.type === type).elId;
      const span = document.createElement('span');
      span.className = 'basket-item ' + (isRight ? 'placed-correct' : 'placed-wrong');
      span.textContent = item.t + (isRight ? ' ✓' : ' ✕');
      document.getElementById(wrapId).appendChild(span);
      score += isRight ? 1 : 0;
      selected = null;
      renderPool();
      const scoreEl = document.getElementById(scoreId);
      if(scoreEl) scoreEl.textContent = `Рахунок: ${score}/${state.length}`;
    });
  });
}
function genBuilder(targetId, poolId, words){
  let built = [], pool = shuffleArray(words);
  function render(){
    const target = document.getElementById(targetId), poolEl = document.getElementById(poolId);
    if(!target || !poolEl) return;
    target.innerHTML = built.length
      ? built.map((w,i)=>`<span class="basket-item" data-i="${i}" style="cursor:pointer;">${w}</span>`).join(' ')
      : '<span class="subtle">Тут з\u2019явиться ваше речення…</span>';
    poolEl.innerHTML = pool.map((w,i)=>`<span class="basket-item" data-i="${i}">${w}</span>`).join('');
    target.querySelectorAll('.basket-item').forEach(el => {
      el.addEventListener('click', () => { const i = parseInt(el.dataset.i); pool.push(built[i]); built.splice(i,1); render(); });
    });
    poolEl.querySelectorAll('.basket-item').forEach(el => {
      el.addEventListener('click', () => { const i = parseInt(el.dataset.i); built.push(pool[i]); pool.splice(i,1); render(); });
    });
  }
  render();
  return {
    check(feedbackId, correctSentence){
      const fb = document.getElementById(feedbackId);
      const isRight = JSON.stringify(built) === JSON.stringify(words);
      fb.className = 'feedback ' + (isRight ? 'ok' : 'bad');
      fb.textContent = isRight
        ? `Чудово! Речення складене правильно: «${correctSentence}»`
        : (built.length < words.length ? 'Спершу розкладіть усі слова.' : 'Ще не той порядок — спробуйте ще раз.');
    },
    shuffle(){ built = []; pool = shuffleArray(words); render(); }
  };
}
