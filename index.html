<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабінет словесності — 5–7 клас</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var u = params.get('u'), g = params.get('g');
  if (u && g) { localStorage.setItem('slovesnist_current_student', JSON.stringify({name:u, grade:g})); }
})();
if(!localStorage.getItem('slovesnist_current_student')){location.href='login.html?next='+encodeURIComponent(location.pathname+location.search);}
</script>
<div class="notebook">

  <div class="hero page">
    <span class="tag" id="student-tag">Кабінет словесності</span>
    <h1>Уроки та домашні завдання</h1>
    <p class="eyebrow-line">Оберіть клас і урок. У кожного уроку є класна робота і домашнє завдання — вони йдуть парою.</p>
    <div class="stat-row">
      <div class="stat"><b id="stat-ready">0</b><span>уроки готові</span></div>
      <div class="stat"><b>~45хв</b><span>класна робота</span></div>
    </div>
  </div>

  <div class="grade-tabs" id="grade-tabs"></div>

  <div class="toc">
    <div id="toc-body"></div>
  </div>

  <footer class="page-footer">Матеріали 6 класу готові; 5 і 7 клас додаються поступово.</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="assets/students.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/platform.js"></script>
<script>
  const current = Platform.getCurrentStudent();
  const tag = document.getElementById('student-tag');
  if (current) {
    tag.textContent = 'Вітаю, ' + current.name + ' (' + current.grade + ' клас) · Вийти';
    tag.style.cursor = 'pointer';
    tag.title = 'Натисни, щоб вийти й обрати іншого учня';
    tag.addEventListener('click', () => Platform.logout());
  }

  let activeGrade = (current && current.grade) || '6';

  function renderTabs() {
    const wrap = document.getElementById('grade-tabs');
    wrap.innerHTML = '';
    Platform.GRADES.forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'grade-tab' + (g === activeGrade ? ' active' : '');
      btn.textContent = g + ' клас';
      btn.addEventListener('click', () => { activeGrade = g; renderTabs(); renderLessons(); });
      wrap.appendChild(btn);
    });
  }

  function renderLessons() {
    const lessons = Platform.LESSONS[activeGrade] || [];
    document.getElementById('stat-ready').textContent = lessons.length;
    const body = document.getElementById('toc-body');
    body.innerHTML = '';
    if (!lessons.length) {
      body.innerHTML = '<p class="eyebrow-line">Матеріали для ' + activeGrade + ' класу зʼявляться тут пізніше.</p>';
      return;
    }
    lessons.forEach((l, i) => {
      const row = document.createElement('div');
      row.className = 'toc-row';
      row.innerHTML = `
        <div class="num">${i + 1}</div>
        <div>
          <div class="topic">${l.title.replace(/^Урок \d+\.\s*/, '')}</div>
          <div class="grammar">${l.topic || ''}</div>
        </div>
        <div class="action">
          <a class="btn small" href="${l.file}">Клас. робота →</a>
          <a class="btn small ghost" href="${l.dzFile}">ДЗ</a>
        </div>`;
      body.appendChild(row);
    });
  }

  renderTabs();
  renderLessons();
</script>
</body>
</html>
