function attachReadingQ1(){
  const wrap = document.getElementById('reading-q1');
  if (!wrap) return;
  const opts = [{t:'Один раз', correct:false}, {t:'Двічі — на початку й ближче до кінця листа', correct:true}, {t:'Жодного разу', correct:false}];
  wrap.innerHTML = opts.map((o,i)=>`<label class="opt" data-i="${i}"><input type="radio" name="read-q1" value="${i}"><span>${o.t}</span></label>`).join('');
  wrap.querySelectorAll('.opt').forEach((el,i) => {
    el.addEventListener('click', () => { wrap.querySelectorAll('.opt').forEach(o => o.classList.remove('correct','incorrect')); el.classList.add(opts[i].correct ? 'correct':'incorrect'); });
  });
}
