function attachHeadWordGame(){
  const wrap = document.getElementById('head-word-list');
  if (!wrap) return;
  wrap.innerHTML = HEAD_WORD_ITEMS.map((it,i) => `
    <div class="punct-row" data-i="${i}">
      <span class="punct-sentence" style="font-style:normal;">
        <button class="qf-btn" data-wi="0" style="border-radius:8px;">${it.phrase[0]}</button>

      <span class="qf-badge" id="hw-result-${i}"></span>
    </div>`).join('');
  wrap.querySelectorAll('.punct-row').forEach((row,i) => {
    row.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (row.dataset.done) return;
        const wi = parseInt(btn.dataset.wi);
        const isRight = wi === HEAD_WORD_ITEMS[i].head;
        btn.style.borderColor = isRight ? 'var(--correct)' : 'var(--incorrect)';

      });
    });
  });
}
const P3_SENTENCE = 'Малий хлопчик швидко зшив дірявий рюкзак.';
const P3_WORDS = [
  {w:'Малий', role:'означення'}, {w:'хлопчик', role:'підмет'}, {w:'швидко', role:'обставина'},
  {w:'зшив', role:'присудок'}, {w:'дірявий', role:'означення'}, {w:'рюкзак', role:'додаток'},
];
const P3_ROLES = ['підмет','присудок','означення','додаток','обставина'];
let p3State = [], p3Selected = null, p3Score = 0;
function renderP3Pool(){
  const pool = document.getElementById('p3-pool');
  if (!pool) return;
  pool.innerHTML = p3State.filter(it => !it.placed).map(it => `<span class="basket-item" data-i="${it.i}">${it.w}</span>`).join('');
  pool.querySelectorAll('.basket-item').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      pool.querySelectorAll('.basket-item').forEach(x => x.style.outline = '');
      el.style.outline = '2px solid var(--sky)';
      p3Selected = parseInt(el.dataset.i);
    });
  });
}
function pickRole(role){
  if (p3Selected === null) return;
  const item = p3State.find(it => it.i === p3Selected);
  if (!item || item.placed) return;
  item.placed = true;
  const isRight = role === item.role;
  if (isRight) p3Score++;
  const result = document.getElementById('p3-result');
  const span = document.createElement('span');
  span.className = 'basket-item ' + (isRight ? 'placed-correct' : 'placed-wrong');
  span.style.display = 'block'; span.style.marginBottom = '6px';
  span.textContent = `${item.w} — ${role}` + (isRight ? ' ✓' : ` ✕ (правильно: ${item.role})`);
  result.appendChild(span);
  p3Selected = null;
  renderP3Pool();
  const scoreEl = document.getElementById('p3-score');
  if (scoreEl) scoreEl.textContent = `Рахунок: ${p3Score}/${p3State.length}`;
}
function attachSentenceRoleGame(){
  document.getElementById('p3-sentence').textContent = P3_SENTENCE;
  p3State = P3_WORDS.map((it,i) => ({...it, i, placed:false}));
  p3Score = 0; p3Selected = null;
  document.getElementById('p3-result').innerHTML = '';
  renderP3Pool();
  const rolesWrap = document.getElementById('p3-roles');
  rolesWrap.innerHTML = P3_ROLES.map(r => `<button class="choice-btn" data-role="${r}">${r}</button>`).join('');
  rolesWrap.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => pickRole(btn.dataset.role)));
}
const MATCH_PAIRS = [
